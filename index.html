<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday Link</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#ff6b81}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{margin:0;background:linear-gradient(180deg,#061426 0%, #081726 60%);color:#e6eef8;min-height:100vh;display:flex;align-items:center;justify-content:center}

    /* Landing link */
    .link-card{background:linear-gradient(135deg,#071428 0%, #081b2b 100%);padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(2,6,23,.7);width:min(760px,94%);text-align:center}
    .title{font-size:24px;margin:0 0 10px}
    .desc{opacity:.8;margin-bottom:18px}
    .fake-link{display:inline-block;padding:12px 18px;border-radius:10px;background:linear-gradient(90deg,#0b9bdc,#7b49ff);color:white;text-decoration:none;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(59,94,138,.25)}

    /* Input overlay */
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);}
    .panel{background:var(--card);padding:22px;border-radius:12px;min-width:320px;max-width:480px;box-shadow:0 8px 26px rgba(2,6,23,.6)}
    .panel h3{margin:0 0 10px}
    .panel input{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:transparent;color:inherit;font-size:16px}
    .panel .row{display:flex;gap:10px;margin-top:12px}
    button{cursor:pointer;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:white;font-weight:700}
    .secondary{background:transparent;border:1px solid rgba(255,255,255,.06)}

    /* Card page */
    .card-page{display:none;min-height:70vh;padding:40px;border-radius:18px;background:linear-gradient(180deg,#081426,#041026);position:relative;overflow:hidden}
    .greeting{font-size:48px;font-weight:800;letter-spacing:1px;margin:40px 0 18px;text-align:center}
    .greeting .name{display:inline-block;transform-origin:center;}
    .sub{opacity:.85;text-align:center;margin-bottom:24px}

    /* animated balloons/characters */
    .chars{display:flex;gap:18px;justify-content:center;margin-top:18px}
    .char{width:72px;height:72px;border-radius:14px;background:linear-gradient(180deg,#fff,#eee);display:flex;align-items:center;justify-content:center;font-size:36px;transform:translateY(0);animation:float 3s ease-in-out infinite}
    .char:nth-child(2){animation-delay:.2s}
    .char:nth-child(3){animation-delay:.4s}
    .char:nth-child(4){animation-delay:.6s}
    @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}

    /* confetti pieces */
    .confetti-piece{position:absolute;width:10px;height:14px;opacity:0.95;border-radius:2px;transform:translateY(-40vh);animation:fall linear forwards}

    @keyframes fall{to{transform:translateY(120vh) rotate(360deg);opacity:1}}

    /* text-pop animation */
    .pop{animation:pop .9s cubic-bezier(.2,.9,.3,1) both}
    @keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)} }

    .controls{display:flex;gap:10px;justify-content:center;margin-top:22px}

    /* small responsiveness */
    @media (max-width:520px){.greeting{font-size:32px}.char{width:56px;height:56px;font-size:28px}}
  </style>
</head>
<body>
  <main class="link-card" role="main">
    <h1 class="title">Create a personalised Happy Birthday</h1>
    <p class="desc">Click the link below, type the name and get a cute animated birthday card — with characters and confetti. Try it!</p>
    <a class="fake-link" id="openLink">Type here to make a card ?</a>
  </main>

  <!-- Input overlay -->
  <div class="overlay" id="overlay" style="display:none">
    <div class="panel">
      <h3>Whose birthday?</h3>
      <input id="nameInput" placeholder="Type name (e.g. Sejal)" maxlength="40" />
      <div class="row">
        <button id="goBtn">Open Card</button>
        <button class="secondary" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Card page -->
  <section class="card-page" id="cardPage">
    <div id="confettiContainer"></div>
    <h2 class="greeting" id="greeting">Happy Birthday <span class="name" id="personName"></span>!</h2>
    <p class="sub">Wishing you loads of smiles, cake & crazy fun ??</p>

    <div class="chars" id="chars">
      <div class="char" title="Balloon">??</div>
      <div class="char" title="Unicorn">??</div>
      <div class="char" title="Cake">??</div>
      <div class="char" title="Party">??</div>
    </div>

    <div class="controls">
      <button id="restart">Play Again</button>
      <button class="secondary" id="backBtn">Back</button>
    </div>
  </section>

<script>
  const openLink = document.getElementById('openLink');
  const overlay = document.getElementById('overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const goBtn = document.getElementById('goBtn');
  const nameInput = document.getElementById('nameInput');
  const cardPage = document.getElementById('cardPage');
  const personName = document.getElementById('personName');
  const confettiContainer = document.getElementById('confettiContainer');
  const restart = document.getElementById('restart');
  const backBtn = document.getElementById('backBtn');
  const greeting = document.getElementById('greeting');

  openLink.addEventListener('click', ()=>{overlay.style.display='flex';nameInput.focus();});
  cancelBtn.addEventListener('click', ()=>{overlay.style.display='none';});

  function startCard(name){
    overlay.style.display='none';
    personName.textContent = name? name : 'Friend';
    // show card
    cardPage.style.display='block';

    // add pop class to greeting/name
    personName.classList.remove('pop');
    greeting.classList.remove('pop');
    void personName.offsetWidth; // reflow
    personName.classList.add('pop');
    greeting.classList.add('pop');

    // spawn confetti
    spawnConfetti(40);
  }

  goBtn.addEventListener('click', ()=>{
    startCard(nameInput.value.trim());
  });

  nameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') startCard(nameInput.value.trim()); });

  backBtn.addEventListener('click', ()=>{
    cardPage.style.display='none';
    confettiContainer.innerHTML='';
    // clear input so user can type again quickly
    nameInput.value = '';
    overlay.style.display='flex';
    nameInput.focus();
  });

  restart.addEventListener('click', ()=>{
    // restart name & animations
    personName.classList.remove('pop');
    greeting.classList.remove('pop');
    void personName.offsetWidth; // reflow
    personName.classList.add('pop');

    confettiContainer.innerHTML='';
    spawnConfetti(40);
  });

  function rand(min,max){return Math.random()*(max-min)+min}
  function spawnConfetti(count){
    const colors=['#ff6b81','#ffd166','#6ee7b7','#7b49ff','#4db9ff'];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className='confetti-piece';
      const w = Math.floor(rand(6,14));
      el.style.width = w+'px';
      el.style.height = Math.floor(w*1.2)+'px';
      el.style.left = Math.floor(rand(0,100))+'%';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.top = Math.floor(rand(-20,10))+'vh';
      el.style.opacity = rand(.85,1);
      const duration = rand(2.2,4.2).toFixed(2)+'s';
      el.style.animationDuration = duration;
      el.style.transform = 'translateY(-40vh) rotate('+Math.floor(rand(0,360))+'deg)';
      confettiContainer.appendChild(el);
      // remove after animation
      setTimeout(()=>{ if(el && el.parentNode) el.parentNode.removeChild(el); }, (parseFloat(duration)*1000)+1200);
    }
  }

  // Allow opening via URL like ?name=Sejal
  (function checkQuery(){
    try{
      const qs = new URLSearchParams(location.search);
      const n = qs.get('name');
      if(n){ startCard(n); }
    }catch(e){}
  })();

  // small UX: allow clicking the fake-link like an actual anchor with focus
  openLink.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openLink.click(); });
</script>
</body>
</html>
